<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to {{ brand_name }}</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/images/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: #000;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #starsCanvas { z-index: 1; }
        #globeCanvas { z-index: 2; }

        /* Content - positioned in upper third */
        .content {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 24px;
            will-change: transform;
        }

        .title-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .title {
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 800;
            font-style: italic;
            letter-spacing: -0.02em;
            line-height: 1.0;
            color: #fff;
        }

        .alpha-badge {
            position: absolute;
            top: -10px;
            right: -70px;
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            font-weight: 600;
            color: #f5c542;
            transform: rotate(12deg);
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.65);
            max-width: 400px;
            line-height: 1.5;
            letter-spacing: 0.01em;
            margin-bottom: 40px;
        }

        .cta-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 80px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: #fff;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(59, 130, 246, 0.15));
            border: none;
            border-radius: 100px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            z-index: 1;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 100px;
            padding: 2px;
            background: linear-gradient(135deg, #8b5cf6, #7353cd);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .cta-button:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(59, 130, 246, 0.25));
            transform: scale(1.02);
        }

        .cta-button svg {
            width: 18px;
            height: 18px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cta-button:hover svg {
            transform: translateX(4px);
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
            z-index: 10;
        }

        .footer-text a {
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .content {
                top: 12%;
            }
            .title {
                font-size: clamp(2.2rem, 10vw, 3.5rem);
            }
            .alpha-badge {
                font-size: 1.4rem;
                right: -50px;
            }
            .cta-button {
                padding: 16px 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="starsCanvas"></canvas>
        <canvas id="globeCanvas"></canvas>

        <div class="content" id="content">
            <div class="title-wrapper">
                <h1 class="title">Welcome to {{ brand_name }}</h1>
                <span class="alpha-badge">Alpha!</span>
            </div>
            <p class="subtitle">Your personal assistant</p>
            <a href="/apps" class="cta-button">
                Get Started
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </a>
        </div>

        <div class="footer-text">
            This site is protected by reCAPTCHA and the Google <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a> apply.
        </div>
    </div>

    <script nonce="{{ g.csp_nonce }}">
        const CONFIG = {
            camera: {
                maxRotX: 0.15,
                maxRotY: 0.25,
                smoothing: 0.06,
                inertiaDecay: 0.97
            },
            globe: {
                rotationSpeed: 0.0015,
                dotSize: 2.2,
                verticalOffset: 0.65,      // Push down to show northern hemisphere
                sizeMultiplier: 0.75,
                dotDensity: 2.5  // Degrees between dots
            },
            stars: {
                far: { count: 600, minSize: 0.4, maxSize: 0.9, opacity: [0.2, 0.45] },
                mid: { count: 450, minSize: 0.6, maxSize: 1.1, opacity: [0.3, 0.6] },
                near: { count: 250, minSize: 0.8, maxSize: 1.5, opacity: [0.5, 0.8] }
            },
            textParallax: 0.002
        };

        const CONTINENTS = {
            northAmerica: [
                [-168,66],[-162,70],[-153,71],[-141,70],[-135,70],[-130,70],[-125,72],[-120,74],[-110,76],[-100,78],[-90,76],[-85,78],[-80,76],[-75,78],[-70,76],[-65,73],[-60,70],[-55,52],[-58,48],[-66,45],[-70,43],[-72,41],[-74,40],[-76,38],[-76,36],[-78,34],[-80,32],[-82,29],[-80,25],[-82,24],[-84,26],[-86,30],[-90,29],[-94,29],[-97,26],[-97,22],[-95,19],[-92,18],[-88,18],[-86,16],[-84,14],[-82,10],[-80,8],[-78,8],[-77,9],[-82,10],[-84,11],[-86,13],[-88,16],[-92,16],[-96,19],[-100,19],[-104,20],[-106,22],[-108,26],[-112,28],[-115,30],[-118,32],[-120,34],[-122,36],[-124,40],[-124,44],[-126,48],[-130,54],[-136,58],[-142,60],[-148,60],[-152,58],[-156,58],[-162,60],[-166,62],[-168,66]
            ],
            southAmerica: [
                [-82,10],[-78,8],[-74,10],[-70,12],[-66,10],[-62,10],[-60,8],[-56,6],[-52,4],[-50,0],[-48,-2],[-44,-2],[-40,-2],[-36,-6],[-35,-10],[-36,-14],[-38,-18],[-42,-22],[-44,-24],[-48,-26],[-50,-30],[-52,-32],[-54,-34],[-58,-36],[-62,-38],[-64,-42],[-66,-46],[-68,-50],[-70,-54],[-72,-52],[-74,-48],[-74,-44],[-72,-40],[-72,-36],[-70,-32],[-70,-28],[-70,-24],[-70,-20],[-74,-18],[-76,-14],[-78,-8],[-80,-4],[-80,0],[-78,4],[-76,6],[-80,8],[-82,10]
            ],
            europe: [
                [-10,36],[-8,38],[-10,40],[-10,44],[-6,44],[-4,48],[-2,50],[2,51],[4,52],[6,54],[8,56],[10,56],[12,58],[14,56],[18,56],[20,58],[22,60],[24,62],[26,64],[28,66],[26,70],[22,72],[18,70],[14,68],[10,64],[8,62],[6,60],[4,58],[2,56],[-2,52],[-4,50],[-6,48],[-8,46],[-10,44],[-10,42],[-8,40],[-6,38],[-8,36],[-10,36]
            ],
            iberia: [
                [-10,36],[-8,36],[-6,36],[-4,36],[-2,38],[0,40],[2,42],[0,44],[-2,44],[-6,44],[-8,44],[-10,42],[-10,40],[-8,38],[-10,36]
            ],
            ukIreland: [
                [-10,50],[-8,52],[-6,54],[-6,56],[-4,58],[-2,60],[0,60],[2,58],[2,54],[0,52],[-2,50],[-4,50],[-6,50],[-8,50],[-10,50]
            ],
            africa: [
                [-18,28],[-14,26],[-10,28],[-8,32],[-6,34],[-2,36],[4,36],[10,36],[12,34],[16,32],[20,32],[26,32],[30,32],[34,30],[36,28],[38,24],[42,18],[44,12],[48,8],[50,4],[44,0],[40,-4],[38,-8],[36,-12],[34,-18],[32,-24],[28,-32],[26,-34],[20,-34],[16,-30],[14,-24],[12,-18],[10,-8],[8,0],[6,4],[4,6],[0,6],[-4,6],[-8,6],[-12,8],[-16,12],[-18,16],[-18,20],[-16,24],[-18,28]
            ],
            asia: [
                [26,42],[30,42],[34,42],[40,42],[44,40],[50,38],[54,36],[60,38],[66,38],[70,36],[76,34],[80,32],[84,28],[88,24],[92,22],[96,18],[100,14],[104,10],[106,6],[108,2],[110,0],[114,-4],[118,-6],[122,-6],[126,-4],[128,0],[126,4],[124,8],[122,12],[120,16],[118,20],[116,24],[118,28],[120,32],[122,36],[124,40],[128,42],[132,44],[136,44],[140,44],[144,46],[148,52],[152,56],[156,60],[160,64],[164,68],[170,70],[176,70],[180,68],[180,72],[172,74],[160,74],[148,72],[136,70],[124,68],[112,68],[100,72],[88,74],[76,74],[68,72],[60,70],[52,68],[46,66],[40,66],[34,64],[30,60],[26,58],[24,54],[24,50],[26,46],[26,42]
            ],
            australia: [
                [114,-22],[116,-20],[120,-18],[126,-14],[132,-12],[136,-12],[140,-14],[144,-14],[148,-18],[152,-24],[154,-28],[152,-32],[148,-36],[144,-38],[140,-38],[136,-36],[132,-34],[128,-32],[124,-32],[120,-30],[116,-28],[114,-26],[114,-22]
            ],
            indonesia: [
                [96,6],[98,4],[100,2],[102,0],[104,-2],[106,-6],[108,-8],[112,-8],[116,-8],[120,-10],[124,-8],[128,-6],[130,-4],[128,0],[124,2],[120,4],[116,4],[112,2],[108,2],[104,4],[100,6],[96,6]
            ],
            japan: [
                [130,32],[132,34],[134,34],[136,36],[140,38],[142,42],[144,44],[142,46],[140,44],[138,42],[136,40],[134,36],[132,34],[130,32]
            ],
            newZealand: [
                [166,-44],[168,-42],[172,-38],[176,-38],[178,-42],[176,-46],[172,-46],[168,-46],[166,-44]
            ],
            madagascar: [
                [44,-12],[48,-14],[50,-18],[50,-22],[48,-26],[46,-26],[44,-24],[44,-20],[44,-16],[44,-12]
            ],
            greenland: [
                [-44,60],[-40,62],[-36,66],[-32,70],[-28,74],[-24,78],[-28,82],[-36,84],[-44,82],[-52,80],[-56,76],[-52,72],[-48,68],[-44,64],[-44,60]
            ]
        };

        function pointInPolygon(x, y, polygon) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i][0], yi = polygon[i][1];
                const xj = polygon[j][0], yj = polygon[j][1];
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function isOnLand(lng, lat) {
            for (const name in CONTINENTS) {
                if (pointInPolygon(lng, lat, CONTINENTS[name])) {
                    return true;
                }
            }
            return false;
        }

        const state = {
            mouse: { x: 0, y: 0 },
            prevMouse: { x: 0, y: 0 },
            mouseVelocity: { x: 0, y: 0 },
            targetCamera: { rotX: 0, rotY: 0 },
            camera: { rotX: 0, rotY: 0 },
            cameraVelocity: { rotX: 0, rotY: 0 },
            globeRotation: 0,
            width: window.innerWidth,
            height: window.innerHeight,
            dpr: Math.min(window.devicePixelRatio || 1, 2),
            lastTime: 0,
            lastMouseMoveTime: Infinity,  // Start with Infinity so no momentum until first mouse move
            hasMouseMoved: false
        };

        const starsCanvas = document.getElementById('starsCanvas');
        const globeCanvas = document.getElementById('globeCanvas');
        const starsCtx = starsCanvas.getContext('2d', { alpha: true });
        const globeCtx = globeCanvas.getContext('2d', { alpha: true });
        const content = document.getElementById('content');

        let stars = [];
        let globeDots = [];
        let cachedGlobeData = null;
        let lastGlobeRotation = -1;
        let lastCameraRotY = -1;

        function resizeCanvases() {
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            state.dpr = Math.min(window.devicePixelRatio || 1, 2);

            [starsCanvas, globeCanvas].forEach(canvas => {
                canvas.width = state.width * state.dpr;
                canvas.height = state.height * state.dpr;
                canvas.style.width = state.width + 'px';
                canvas.style.height = state.height + 'px';
            });

            starsCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
            globeCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

            cachedGlobeData = null;
        }

        function initStars() {
            stars = [];
            const configs = [CONFIG.stars.far, CONFIG.stars.mid, CONFIG.stars.near];
            const rotScales = [0.3, 0.5, 0.7];

            configs.forEach((config, layerIndex) => {
                for (let i = 0; i < config.count; i++) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    stars.push({
                        bx: Math.sin(phi) * Math.cos(theta),
                        by: Math.cos(phi),
                        bz: Math.sin(phi) * Math.sin(theta),
                        size: config.minSize + Math.random() * (config.maxSize - config.minSize),
                        opacity: config.opacity[0] + Math.random() * (config.opacity[1] - config.opacity[0]),
                        rotScale: rotScales[layerIndex]
                    });
                }
            });
        }

        function initGlobeDots() {
            globeDots = [];

            const density = CONFIG.globe.dotDensity;

            for (let lat = -90; lat <= 90; lat += density) {
                for (let lng = -180; lng <= 180; lng += density) {
                    if (isOnLand(lng, lat)) {
                        const latRad = lat * Math.PI / 180;
                        const lngRad = lng * Math.PI / 180;

                        const cosLat = Math.cos(latRad);
                        globeDots.push({
                            x: cosLat * Math.cos(lngRad),
                            y: Math.sin(latRad),
                            z: cosLat * Math.sin(lngRad)
                        });
                    }
                }
            }

            console.log(`Generated ${globeDots.length} land dots`);
        }

        function rotatePoint(x, y, z, cosRX, sinRX, cosRY, sinRY) {
            const x1 = x * cosRY + z * sinRY;
            const z1 = -x * sinRY + z * cosRY;
            const y2 = y * cosRX - z1 * sinRX;
            const z2 = y * sinRX + z1 * cosRX;
            return { x: x1, y: y2, z: z2 };
        }

        function drawStars() {
            const { width, height } = state;
            const centerX = width / 2;
            const centerY = height / 2;
            const scale = Math.min(width, height) * 1.5;

            starsCtx.clearRect(0, 0, width, height);

            const camRX = state.camera.rotX;
            const camRY = state.camera.rotY;

            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                const rotScale = star.rotScale;

                const rx = camRX * rotScale;
                const ry = camRY * rotScale;
                const cosRX = Math.cos(rx);
                const sinRX = Math.sin(rx);
                const cosRY = Math.cos(ry);
                const sinRY = Math.sin(ry);

                const p = rotatePoint(star.bx, star.by, star.bz, cosRX, sinRX, cosRY, sinRY);

                if (p.z > -0.3) {
                    const screenX = centerX + p.x * scale;
                    const screenY = centerY - p.y * scale;
                    const fade = (p.z + 0.3) / 1.3;
                    const alpha = star.opacity * fade;

                    if (alpha > 0.02) {
                        starsCtx.beginPath();
                        starsCtx.arc(screenX, screenY, star.size, 0, Math.PI * 2);
                        starsCtx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
                        starsCtx.fill();
                    }
                }
            }
        }

        function drawGlobe() {
            const { width, height } = state;
            const radius = Math.min(width, height) * CONFIG.globe.sizeMultiplier;
            const centerX = width / 2;
            const centerY = height * (0.5 + CONFIG.globe.verticalOffset);
            const dotSize = CONFIG.globe.dotSize;

            globeCtx.clearRect(0, 0, width, height);

            const outerGlow = globeCtx.createRadialGradient(
                centerX, centerY, radius * 0.85,
                centerX, centerY, radius * 1.4
            );
            outerGlow.addColorStop(0, 'rgba(200, 200, 210, 0.06)');
            outerGlow.addColorStop(0.4, 'rgba(180, 180, 190, 0.03)');
            outerGlow.addColorStop(1, 'rgba(150, 150, 160, 0)');

            globeCtx.fillStyle = outerGlow;
            globeCtx.beginPath();
            globeCtx.arc(centerX, centerY, radius * 1.4, 0, Math.PI * 2);
            globeCtx.fill();

            const surfaceGradient = globeCtx.createRadialGradient(
                centerX - radius * 0.25, centerY - radius * 0.25, 0,
                centerX, centerY, radius
            );
            surfaceGradient.addColorStop(0, 'rgba(35, 35, 40, 0.85)');
            surfaceGradient.addColorStop(0.6, 'rgba(20, 20, 25, 0.9)');
            surfaceGradient.addColorStop(1, 'rgba(12, 12, 16, 0.95)');

            globeCtx.fillStyle = surfaceGradient;
            globeCtx.beginPath();
            globeCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            globeCtx.fill();

            const rimGlow = globeCtx.createRadialGradient(
                centerX + radius * 0.3, centerY + radius * 0.3, radius * 0.6,
                centerX, centerY, radius * 1.1
            );
            rimGlow.addColorStop(0, 'rgba(255, 255, 255, 0)');
            rimGlow.addColorStop(0.7, 'rgba(255, 255, 255, 0.08)');
            rimGlow.addColorStop(0.9, 'rgba(255, 255, 255, 0.12)');
            rimGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');

            globeCtx.fillStyle = rimGlow;
            globeCtx.beginPath();
            globeCtx.arc(centerX, centerY, radius * 1.1, 0, Math.PI * 2);
            globeCtx.fill();

            const cosGR = Math.cos(state.globeRotation);
            const sinGR = Math.sin(state.globeRotation);
            const cosRX = Math.cos(state.camera.rotX);
            const sinRX = Math.sin(state.camera.rotX);
            const cosRY = Math.cos(state.camera.rotY);
            const sinRY = Math.sin(state.camera.rotY);

            const visible = [];

            for (let i = 0; i < globeDots.length; i++) {
                const dot = globeDots[i];

                const x1 = dot.x * cosGR + dot.z * sinGR;
                const z1 = -dot.x * sinGR + dot.z * cosGR;
                const y1 = dot.y;

                const x2 = x1 * cosRY + z1 * sinRY;
                const z2 = -x1 * sinRY + z1 * cosRY;
                const y2 = y1 * cosRX - z2 * sinRX;
                const z3 = y1 * sinRX + z2 * cosRX;

                if (z3 > 0.05) {
                    visible.push({ x: x2, y: y2, z: z3 });
                }
            }

            visible.sort((a, b) => a.z - b.z);

            for (let i = 0; i < visible.length; i++) {
                const dot = visible[i];
                const screenX = centerX + dot.x * radius;
                const screenY = centerY - dot.y * radius;

                if (screenY > height + 10 || screenY < -50) continue;

                const zNorm = dot.z;
                const opacity = 0.3 + zNorm * 0.6;

                const size = dotSize * (0.7 + zNorm * 0.3);

                if (size > 0.3) {
                    globeCtx.beginPath();
                    globeCtx.arc(screenX, screenY, size / 2, 0, Math.PI * 2);
                    globeCtx.fillStyle = `rgba(255, 255, 255, ${opacity.toFixed(2)})`;
                    globeCtx.fill();
                }
            }
        }

        function updateContent() {
            const offsetX = state.camera.rotY * 10 * CONFIG.textParallax * 100;
            const offsetY = state.camera.rotX * 8 * CONFIG.textParallax * 100;
            content.style.transform = `translateX(calc(-50% + ${offsetX}px)) translateY(${offsetY}px)`;
        }

        function updateCamera(deltaTime, currentTime) {
            if (!state.hasMouseMoved) {
                return;
            }

            const timeSinceMouseMove = currentTime - state.lastMouseMoveTime;
            const isMouseIdle = timeSinceMouseMove > 100;

            const targetRotY = state.mouse.x * CONFIG.camera.maxRotY;
            const targetRotX = state.mouse.y * CONFIG.camera.maxRotX;

            const smoothFactor = 1 - Math.pow(1 - CONFIG.camera.smoothing, deltaTime * 60);

            if (isMouseIdle && (Math.abs(state.cameraVelocity.rotX) > 0.0001 || Math.abs(state.cameraVelocity.rotY) > 0.0001)) {
                state.camera.rotY += state.cameraVelocity.rotY * deltaTime * 60;
                state.camera.rotX += state.cameraVelocity.rotX * deltaTime * 60;

                const decay = Math.pow(CONFIG.camera.inertiaDecay, deltaTime * 60);
                state.cameraVelocity.rotY *= decay;
                state.cameraVelocity.rotX *= decay;

                state.camera.rotY = Math.max(-CONFIG.camera.maxRotY, Math.min(CONFIG.camera.maxRotY, state.camera.rotY));
                state.camera.rotX = Math.max(-CONFIG.camera.maxRotX, Math.min(CONFIG.camera.maxRotX, state.camera.rotX));
            } else if (!isMouseIdle) {
                const prevRotY = state.camera.rotY;
                const prevRotX = state.camera.rotX;

                state.camera.rotY += (targetRotY - state.camera.rotY) * smoothFactor;
                state.camera.rotX += (targetRotX - state.camera.rotX) * smoothFactor;

                state.cameraVelocity.rotY = (state.camera.rotY - prevRotY);
                state.cameraVelocity.rotX = (state.camera.rotX - prevRotX);
            }
        }

        function animate(currentTime) {
            const deltaTime = state.lastTime ? (currentTime - state.lastTime) / 1000 : 0.016;
            state.lastTime = currentTime;

            const cappedDelta = Math.min(deltaTime, 0.1);

            state.globeRotation += CONFIG.globe.rotationSpeed * cappedDelta * 60;

            updateCamera(cappedDelta, currentTime);

            drawStars();
            drawGlobe();
            updateContent();

            requestAnimationFrame(animate);
        }

        function handleMouseMove(e) {
            state.mouse.x = (e.clientX / state.width) * 2 - 1;
            state.mouse.y = (e.clientY / state.height) * 2 - 1;
            state.lastMouseMoveTime = performance.now();
            state.hasMouseMoved = true;
        }

        function handleResize() {
            resizeCanvases();
            initStars();
        }

        function init() {
            resizeCanvases();
            initStars();
            initGlobeDots();

            window.addEventListener('mousemove', handleMouseMove, { passive: true });
            window.addEventListener('resize', handleResize, { passive: true });

            requestAnimationFrame(animate);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
