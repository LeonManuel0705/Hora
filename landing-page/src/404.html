<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | {{BRAND_NAME}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/@lottiefiles/lottie-player@2/dist/lottie-player.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Radio Canada Big', system-ui, sans-serif;
        color: #1A202C;
        background: linear-gradient(to bottom, #F3F0FF, #FFFFFF 50%, #FDF2F8);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        overflow: hidden;
      }

      .wrapper {
        max-width: 600px;
        width: 100%;
        text-align: center;
      }

      .lottie-container {
        max-width: 480px;
        margin: 0 auto 1.5rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.75rem;
        font-family: 'Radio Canada Big', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s;
      }

      .btn svg { width: 20px; height: 20px; }

      .btn-primary {
        background: linear-gradient(135deg, #7e60db 0%, #7353cd 100%);
        color: #fff;
        border: none;
        box-shadow: 0 4px 14px rgba(61, 123, 255, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(61, 123, 255, 0.4);
      }

      .btn-secondary {
        background: transparent;
        color: #475569;
        border: 1.5px solid #E2E8F0;
      }

      .btn-secondary:hover {
        border-color: #7353cd;
        color: #7353cd;
        background: rgba(115, 83, 205, 0.04);
      }

      @media (max-width: 480px) {
        .actions { flex-direction: column; align-items: center; }
        .btn { width: 100%; max-width: 260px; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="lottie-container">
        <lottie-player
          src="https://assets-v2.lottiefiles.com/a/9460ab10-1167-11ee-8321-efa128f47af6/TsxwhrIeaL.json"
          background="transparent"
          speed="1"
          loop
          autoplay
        ></lottie-player>
      </div>

      <div class="actions">
        <a href="/" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
          Back to Home
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
          Go Back

      </div>
    </div>
  </body>
</html>
