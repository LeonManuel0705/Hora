<!DOCTYPE html>
<html lang="de">
<head>
  <base href="/pwa/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Dein persönlicher Produktivitäts-Hub für Schule, Studium und Alltag.">
  <meta name="theme-color" content="#F8F6EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1410" media="(prefers-color-scheme: dark)">

  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hora">
  <meta name="mobile-web-app-capable" content="yes">

  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  
  <meta name="apple-mobile-web-app-orientations" content="portrait">

  
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hora</title>
  <link rel="manifest" href="manifest.json">

  
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #F8F6EE;
      --ink: #2E3A2F;
      --muted: #5E665B;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #0F1410;
        --ink: #EDEBE4;
        --muted: #B8B8AF;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--canvas);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    body {
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--canvas);
      z-index: 9999;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      animation: enter .42s cubic-bezier(.23, 1, .32, 1) both;
    }

    .loading-logo {
      width: 72px;
      height: 72px;
      margin-bottom: 18px;
      border-radius: 16px;
    }

    .loading-text {
      color: var(--ink);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .loading-sub {
      color: var(--muted);
      font-size: 15px;
      margin-top: 8px;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    #hub-safe-area {
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      visibility: hidden;
      pointer-events: none;
    }

    #hub-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 2;
      background: var(--canvas);
      opacity: 0;
      visibility: hidden;
      transition: opacity .22s cubic-bezier(.23, 1, .32, 1), visibility 0s linear .22s;
    }

    #hub-frame[data-shown] {
      opacity: 1;
      visibility: visible;
      transition: opacity .22s cubic-bezier(.23, 1, .32, 1), visibility 0s;
    }

    @media (prefers-reduced-motion: reduce) {
      .loading { animation: none; }
      #hub-frame, #hub-frame[data-shown] { transition: none; }
    }
  </style>
</head>
<body>
  <div id="hub-safe-area" aria-hidden="true"></div>
  <div class="loading" id="loading">
    <img class="loading-logo" src="icons/Icon-192.png" alt="Hora">
    <div class="loading-text">Hora</div>
    <div class="loading-sub">Wird geladen...</div>
  </div>

  <script>
    window.hubHistory = { open: false, skip: 0, close: null };
    window.addEventListener('popstate', function(event) {
      var hub = window.hubHistory;
      if (hub.skip > 0) {
        hub.skip--;
        event.stopImmediatePropagation();
      } else if (event.state && event.state.hubNative) {
        hub.skip++;
        event.stopImmediatePropagation();
        history.back();
      } else if (hub.open && hub.close) {
        event.stopImmediatePropagation();
        hub.close();
      }
    }, true);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        return Promise.all(registrations.filter(function(registration) {
          var worker = registration.active || registration.waiting || registration.installing;
          return !worker || !/\/hub_worker\.js$/.test(new URL(worker.scriptURL).pathname);
        }).map(function(registration) { return registration.unregister(); }));
      }).catch(function() {});
      if (window.caches) {
        caches.keys().then(function(names) {
          return Promise.all(names.map(function(name) { return caches.delete(name); }));
        }).catch(function() {});
      }
    }

    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.3s ease';
        setTimeout(function() { loading.style.display = 'none'; }, 300);
      }
    });

    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading && loading.style.display !== 'none') {
        var sub = loading.querySelector('.loading-sub');
        if (sub) sub.textContent = 'Laden dauert länger als erwartet. Bitte Seite neu laden.';
      }
    }, 20000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
