name: app
description: "Calendar, tasks, mail, school timetable and transit routing in one offline first system."

publish_to: 'none'

version: 0.5.0+34

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.3.0
  # FFI-backed sqflite for Windows/Linux desktop (plain sqflite has no impl there);
  # sqlite3_flutter_libs bundles the native SQLite library so the FFI factory works.
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.1
  path: ^1.9.0
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  provider: ^6.1.1

  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  connectivity_plus: ^5.0.2
  http: ^1.2.0
  flutter_inappwebview: ^6.0.0

  enough_mail: ^2.1.6

  workmanager: ^0.6.0
  flutter_local_notifications: ^17.0.0

  intl: ^0.19.0
  uuid: ^4.2.1
  url_launcher: ^6.2.1
  html: ^0.15.4
  crypto: ^3.0.3

  cupertino_icons: ^1.0.8
  lottie: ^3.3.1

  hive: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2E3A2F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon_rounded.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon_macos.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/nav_selection.json
    - assets/curriculum/formeln.json
    - assets/curriculum/epochen.json
    - assets/curriculum/topics.json
    - assets/curriculum/concepts.json
    - assets/ui/pages/
    - assets/ui/static/app/css/
    - assets/ui/static/app/css/pages/
    - assets/ui/static/app/img/
    - assets/ui/static/app/img/tinte/
    - assets/ui/static/app/js/
    - assets/ui/static/app/js/pages/
    - assets/ui/static/css/
    - assets/ui/static/fonts/
    - assets/ui/static/js/

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Light.ttf
          weight: 300
        - asset: assets/fonts/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

