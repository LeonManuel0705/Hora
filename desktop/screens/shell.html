<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <main class="stage" id="stage">
    <div class="brand">
      <svg class="mark" viewBox="0 1 100 100" aria-hidden="true" focusable="false"><circle class="mark-a" cx="40" cy="44" r="26"/><rect class="mark-b" x="44" y="42" width="42" height="42" rx="12"/><path class="mark-c" d="M44 69.69V54A12 12 0 0 1 56 42H65.92A26 26 0 0 1 44 69.69Z"/></svg>
      <h1 class="name" id="name"></h1>
    </div>

    <section class="loading" id="loading">
      <svg class="spinner" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="spinner-track" cx="12" cy="12" r="10"/><path class="spinner-arc" d="M12 2a10 10 0 0 1 10 10"/></svg>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="problem" id="problem" hidden>
      <div class="card" role="alert">
        <svg class="icon card-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <h2 class="heading" id="heading"></h2>
        <p class="message" id="message"></p>
        <p class="detail" id="detail" hidden></p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="button" data-action="retry" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span data-label></span>
        </button>
        <button class="btn btn-quiet" type="button" data-action="partial" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          <span data-label></span>
        </button>
        <button class="btn btn-quiet" type="button" data-action="log" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
          <span data-label></span>
        </button>
        <button class="btn btn-quiet" type="button" data-action="link" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
          <span data-label></span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
