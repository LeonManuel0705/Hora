name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest tests/ -v

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
        working-directory: flutter_app

      - run: flutter analyze --no-fatal-infos
        working-directory: flutter_app

      - run: flutter test
        working-directory: flutter_app

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter build apk --debug
        working-directory: flutter_app

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter build web
        working-directory: flutter_app

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter build linux
        working-directory: flutter_app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter build windows
        working-directory: flutter_app
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

  build-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter build ios --debug --no-codesign
        working-directory: flutter_app
      - run: flutter build macos --debug
        working-directory: flutter_app

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Freeze the backend so the packaged app needs no system Python, then
      # copy it in for electron-builder to bundle. Validates the whole pipeline.
      - run: bash scripts/build_backend.sh
      - run: node --check main.js
        working-directory: desktop
      - run: npm install
        working-directory: desktop
      - run: npm run bundle-backend
        working-directory: desktop
      # --dir produces an unpacked build (fast) and validates the packaging config.
      - run: npx electron-builder --linux --dir
        working-directory: desktop
      - name: Verify frozen backend is bundled
        run: test -x desktop/dist/linux-unpacked/resources/backend/server/server
