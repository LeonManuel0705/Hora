name: Release

# Kept separate from ci.yml: ci.yml runs on every push/PR (including forks) where
# signing secrets are not available. This workflow only runs for real releases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Reconstruct the keystore from the base64 secret into an ABSOLUTE path.
      # storeFile in build.gradle.kts resolves relative paths against the app
      # module dir, so we hand it a fully-qualified path to avoid ambiguity.
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Write key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > flutter_app/android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=${RUNNER_TEMP}/release.jks
          EOF

      - run: flutter pub get
        working-directory: flutter_app

      - run: flutter build appbundle --release
        working-directory: flutter_app

      - run: flutter build apk --release
        working-directory: flutter_app

      # Remove signing material before the job ends (defense in depth).
      - name: Clean up signing material
        if: always()
        run: rm -f flutter_app/android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: desktop/dist/*.exe
          - os: ubuntu-latest
            target: --linux
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: bash scripts/build_backend.sh

      - run: npm ci
        working-directory: desktop

      - run: npm test
        working-directory: desktop

      - run: npm run bundle-backend
        working-directory: desktop

      - run: npx electron-builder ${{ matrix.target }} --publish never
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android-release, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(jq -r .name brand/brand.json)
          VERSION="${GITHUB_REF_NAME#v}"
          mv release/app-release.apk "release/${NAME}-${VERSION}.apk"
          mv release/app-release.aab "release/${NAME}-${VERSION}.aab"
          gh release create "$GITHUB_REF_NAME" release/* --draft --title "${NAME} ${VERSION}" --generate-notes
