      "s3_sub2_p1": "When you use the real-time transit feature, requests are sent to the public APIs of VBB (Verkehrsverbund Berlin-Brandenburg) and Deutsche Bahn. Only the stop names or route information you enter are transmitted — no personal data, device IDs, or location data.",
