<!DOCTYPE html>
<html lang="de">
<head>
  <base href="/pwa/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Dein persönlicher Produktivitäts-Hub für Schule, Studium und Alltag.">
  <meta name="theme-color" content="#7353CD">

  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hora">
  <meta name="mobile-web-app-capable" content="yes">

  
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  
  <meta name="apple-mobile-web-app-orientations" content="portrait">

  
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hora</title>
  <link rel="manifest" href="manifest.json">

  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #14131A;
      
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    
    body {
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #14131A 0%, #1D1C24 100%);
      z-index: 9999;
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-text {
      color: #B7A6F6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .loading-sub {
      color: #9E9DAA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin-top: 8px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
  </style>
</head>
<body>
  
  <div class="loading" id="loading">
    <img class="loading-logo" src="icons/Icon-192.png" alt="Hora">
    <div class="loading-text">Hora</div>
    <div class="loading-sub">Wird geladen...</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      Promise.race([
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            return Promise.all(registrations.map(function(r) { return r.unregister(); }));
          }),
          caches.keys().then(function(names) {
            return Promise.all(names.map(function(name) { return caches.delete(name); }));
          })
        ]),
        new Promise(function(resolve) { setTimeout(resolve, 3000); })
      ]).catch(function() {});
    }

    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.3s ease';
        setTimeout(function() { loading.style.display = 'none'; }, 300);
      }
    });

    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading && loading.style.display !== 'none') {
        var sub = loading.querySelector('.loading-sub');
        if (sub) sub.textContent = 'Laden dauert länger als erwartet. Bitte Seite neu laden.';
      }
    }, 20000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
